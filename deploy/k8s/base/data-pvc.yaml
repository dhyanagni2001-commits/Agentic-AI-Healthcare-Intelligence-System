# Holds the CMS CSVs and the persisted FAISS index (data/vector_index, ~0.5 GB).
# The first pod builds the index if it is missing and saves it here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: healthiq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
