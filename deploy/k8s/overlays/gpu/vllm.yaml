apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0
          args:
            - --model=Qwen/Qwen2.5-1.5B-Instruct   # ungated, fits a 16-24 GB GPU (T4/L4/A10)
            - --served-model-name=Qwen/Qwen2.5-1.5B-Instruct
            - --port=8000
            - --max-model-len=4096
            - --gpu-memory-utilization=0.90
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: healthiq-secrets, key: HF_TOKEN, optional: true}}
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
            limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
          # Model download + weight load + CUDA graph capture: allow up to 20 min.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
        - name: hf-cache
          emptyDir: {}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector: {app: vllm}
  ports: [{name: http, port: 8000, targetPort: http}]
